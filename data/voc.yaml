# Images and labels direcotry should be relative to train.py
TRAIN_DIR_IMAGES: 'organized_voc2012/train/images'
TRAIN_DIR_LABELS: 'organized_voc2012/train/annotations'
VALID_DIR_IMAGES: 'organized_voc2012/valid/images'
VALID_DIR_LABELS: 'organized_voc2012/valid/annotations'

# Class names.
CLASSES: [
    '__background__',
    "aeroplane", "bicycle", "bird", "boat", "bottle", "bus", "car", "cat",
    "chair", "cow", "diningtable", "dog", "horse", "motorbike", "person",
    "pottedplant", "sheep", "sofa", "train", "tvmonitor"
]

# Number of classes (object classes + 1 for background).
NC: 21

# Whether to save the predictions of the validation set while training.
SAVE_VALID_PREDICTION_IMAGES: False
